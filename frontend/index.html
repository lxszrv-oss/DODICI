<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <title>DODICI</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- START SCREEN -->
  <div id="mainMenu" class="main-menu hidden">

    <div class="start-brand">
      DODICI
    </div>

    <div class="start-subtitle">
      МИНИ-ПРИЛОЖЕНИЕ
    </div>

    <button
      id="startGame"
      class="start-button"
      type="button"
    >
      НАЖМИ, ЧТОБЫ НАЧАТЬ
    </button>

  </div>


  <!-- SIDE MENU -->
  <aside
    id="sideMenu"
    class="side-menu"
  >

    <div class="side-menu-brand">
      DODICI
    </div>

    <div class="side-menu-line"></div>

    <button
      id="ratingButton"
      class="side-button"
      type="button"
    >
      РЕЙТИНГ
    </button>

    <button
      id="profileButton"
      class="side-button"
      type="button"
    >
      ПРОФИЛЬ
    </button>

    <button
      id="howButton"
      class="side-button"
      type="button"
    >
      КАК ИГРАТЬ
    </button>

    <button
      id="settingsButton"
      class="side-button"
      type="button"
    >
      НАСТРОЙКИ
    </button>

  </aside>


  <div
    id="menuOverlay"
    class="menu-overlay"
  ></div>


  <!-- GAME -->
  <main class="app">

    <!-- TOP -->
    <header class="topbar">

      <button
        id="menuButton"
        class="menu-button-icon"
        type="button"
        aria-label="Открыть меню"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>


      <div class="brand-block">

        <div class="brand-crown">
          ♛
        </div>

        <div class="brand">
          DODICI
        </div>

        <div class="brand-subtitle">
          МИНИ-ПРИЛОЖЕНИЕ
        </div>

      </div>


      <div class="prize">
        1 000 000 ₽
      </div>

    </header>


    <!-- HUD -->
    <section class="hud">

      <div class="hud-item">

        <span class="hud-label">
          УРОВЕНЬ
        </span>

        <strong
          id="level"
          class="hud-value"
        >
          01 / 12
        </strong>

      </div>


      <div class="hud-divider"></div>


      <div class="hud-item hud-attempt">

        <span class="hud-label">
          ПОПЫТКА
        </span>

        <strong
          id="attempt"
          class="hud-value"
        >
          1
        </strong>

      </div>

    </section>


    <!-- HERO -->
    <section class="hero">

      <div class="hero-kicker">

        <span></span>

        <p>
          12 ПРАВИЛЬНЫХ ВЫБОРОВ
        </p>

        <span></span>

      </div>


      <h1>
        Найди карту.
      </h1>


      <p class="hero-description">
        Одна из трёх — проигрышная.<br>
        Сделай выбор.
      </p>

    </section>


    <!-- CARDS -->
    <section class="cards">

      <button
        class="card"
        data-index="0"
        type="button"
      >
        <span class="card-number">
          1
        </span>
      </button>


      <button
        class="card"
        data-index="1"
        type="button"
      >
        <span class="card-number">
          2
        </span>
      </button>


      <button
        class="card"
        data-index="2"
        type="button"
      >
        <span class="card-number">
          3
        </span>
      </button>

    </section>


    <!-- STATUS -->
    <p
      id="status"
      class="status"
    >
      ВЫБЕРИ ОДНУ КАРТУ
    </p>


    <!-- END -->
    <section
      id="end"
      class="end hidden"
    >

      <div
        id="endTitle"
        class="end-title"
      ></div>

      <div
        id="endText"
        class="end-text"
      ></div>

      <button
        id="restart"
        class="restart-button"
        type="button"
      >
        ПОПРОБОВАТЬ СНОВА
      </button>

    </section>


    <!-- RATING MODAL -->
    <section
      id="ratingModal"
      class="rating-modal hidden"
    >

      <div class="rating-window">

        <button
          id="ratingClose"
          class="rating-close"
          type="button"
          aria-label="Закрыть рейтинг"
        >
          ×
        </button>


        <div class="rating-header">

          <div class="rating-title">
            РЕЙТИНГ DODICI
          </div>

          <div class="rating-subtitle">
            Лучшие игроки
          </div>

        </div>


        <div
          id="ratingList"
          class="rating-list"
        ></div>

      </div>

    </section>


    <!-- FOOTER -->
    <footer class="footer">
      БЕСПЛАТНАЯ ИГРА • DODICI
    </footer>

  </main>


  <script src="game.js"></script>

</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  >
  <title>DODICI</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- START SCREEN -->
  <div id="mainMenu" class="main-menu">
    <div class="menu-logo">😈</div>

    <h1>DODICI</h1>

    <p class="menu-subtitle">
      THE LUCK IS YOURS
    </p>

    <div class="tap-to-start">
      НАЖМИ, ЧТОБЫ НАЧАТЬ
    </div>
  </div>


  <!-- SIDE MENU -->
  <aside id="sideMenu" class="side-menu">

    <div class="side-menu-title">
      😈 DODICI
    </div>

    <button id="ratingButton" class="side-button" type="button">
      🏆 Рейтинг
    </button>

    <button id="profileButton" class="side-button" type="button">
      👤 Профиль
    </button>

    <button id="howButton" class="side-button" type="button">
      ❓ Как играть
    </button>

    <button id="settingsButton" class="side-button" type="button">
      ⚙️ Настройки
    </button>

  </aside>

  <div id="menuOverlay" class="menu-overlay"></div>


  <!-- GAME -->
  <main class="app">

    <button
      id="menuButton"
      class="menu-button-icon"
      type="button"
      aria-label="Открыть меню"
    >
      ☰
    </button>

    <header>
      <div class="brand">
        DODICI
      </div>

      <div class="prize">
        1 000 000 ₽
      </div>
    </header>


    <!-- HUD -->
    <section class="hud">

      <div>
        <span>УРОВЕНЬ</span>
        <strong id="level">01 / 12</strong>
      </div>

      <div>
        <span>ПОПЫТКА</span>
        <strong id="attempt">1</strong>
      </div>

    </section>


    <!-- HERO -->
    <section class="hero">

      <p>
        12 ПРАВИЛЬНЫХ ВЫБОРОВ
      </p>

      <h1>
        Найди карту.
      </h1>

      <small>
        Одна из трёх — проигрышная.<br>
        Сделай выбор.
      </small>

    </section>


    <!-- CARDS -->
    <section class="cards">

      <button
        class="card"
        data-index="0"
        type="button"
      >
        D
      </button>

      <button
        class="card"
        data-index="1"
        type="button"
      >
        D
      </button>

      <button
        class="card"
        data-index="2"
        type="button"
      >
        D
      </button>

    </section>


    <!-- STATUS -->
    <p id="status">
      Выбери одну карту
    </p>


    <!-- END -->
    <section id="end" class="end hidden">

      <div id="endTitle"></div>

      <div id="endText"></div>

      <button
        id="restart"
        type="button"
      >
        ПОПРОБОВАТЬ СНОВА
      </button>

    </section>


    <!-- RATING MODAL -->
    <section
      id="ratingModal"
      class="rating-modal hidden"
    >

      <div class="rating-window">

        <button
          id="ratingClose"
          class="rating-close"
          type="button"
          aria-label="Закрыть рейтинг"
        >
          ✕
        </button>

        <div class="rating-header">

          <div class="rating-icon">
            🏆
          </div>

          <div>

            <div class="rating-title">
              РЕЙТИНГ DODICI
            </div>

            <div class="rating-subtitle">
              Лучшие игроки
            </div>

          </div>

        </div>

        <div
          id="ratingList"
          class="rating-list"
        ></div>

      </div>

    </section>


    <!-- FOOTER -->
    <footer>
      Бесплатная игра • DODICI
    </footer>

  </main>


  <script src="game.js"></script>

</body>
</html>

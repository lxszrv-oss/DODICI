<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>DODICI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       START SCREEN
  ========================== -->

  <div id="mainMenu" class="main-menu">

    <div class="menu-logo">
      ♛
    </div>

    <h1>DODICI</h1>

    <div class="menu-subtitle">
      12 LEVELS · 1 CHOICE
    </div>

    <div class="tap-to-start">
      НАЖМИ, ЧТОБЫ НАЧАТЬ
    </div>

  </div>


  <!-- =========================
       SIDE MENU
  ========================== -->

  <div id="menuOverlay" class="menu-overlay"></div>

  <aside id="sideMenu" class="side-menu">

    <div class="side-menu-title">
      DODICI
    </div>

    <button
      id="ratingButton"
      class="side-button"
      type="button"
    >
      🏆 &nbsp; Рейтинг
    </button>

    <button
      id="profileButton"
      class="side-button"
      type="button"
    >
      👤 &nbsp; Профиль
    </button>

    <button
      id="howButton"
      class="side-button"
      type="button"
    >
      ❓ &nbsp; Как играть
    </button>

    <button
      id="settingsButton"
      class="side-button"
      type="button"
    >
      ⚙️ &nbsp; Настройки
    </button>

  </aside>


  <!-- =========================
       MAIN APP
  ========================== -->

  <main class="app">

    <!-- HEADER -->

    <header>

      <button
        id="menuButton"
        class="menu-button-icon"
        type="button"
        aria-label="Открыть меню"
      >
        ☰
      </button>

      <div class="brand">
        DODICI
      </div>

      <div class="prize">
        <strong>12</strong>
      </div>

    </header>


    <!-- HUD -->

    <section class="hud">

      <div>
        <span>УРОВЕНЬ</span>
        <strong id="level">01 / 12</strong>
      </div>

      <div>
        <span>ПОПЫТКА</span>
        <strong id="attempt">1</strong>
      </div>

    </section>


    <!-- HERO -->

    <section class="hero">

      <p>
        ВЫБЕРИ ОДНУ КАРТУ
      </p>

      <h1>
        ТВОЙ ХОД
      </h1>

      <small>
        Только одна карта правильная
      </small>

    </section>


    <!-- CARDS -->

    <section class="cards">

      <button
        class="card"
        data-index="0"
        type="button"
        aria-label="Карта 1"
      >
        D
      </button>

      <button
        class="card"
        data-index="1"
        type="button"
        aria-label="Карта 2"
      >
        D
      </button>

      <button
        class="card"
        data-index="2"
        type="button"
        aria-label="Карта 3"
      >
        D
      </button>

    </section>


    <!-- STATUS -->

    <div id="status">
      Нажми «Начать», чтобы играть
    </div>


    <!-- END SCREEN -->

    <section
      id="end"
      class="end hidden"
    >

      <div id="endTitle">
        ЗАБЕГ ОКОНЧЕН
      </div>

      <div id="endText">
        Попробуй ещё раз
      </div>

      <button
        id="restart"
        type="button"
      >
        ИГРАТЬ СНОВА
      </button>

    </section>


    <!-- FOOTER -->

    <footer>
      DODICI · 12 LEVELS
    </footer>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="game.js"></script>

</body>
</html>
